name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://taskforge:taskforge@localhost:5432/taskforge_test
      SECRET_KEY: ci-secret-key-long-enough-for-hs256

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Verify migrations match the models
        # Catches the classic bug where a model changes but nobody generates a migration.
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Test
        run: uv run pytest -q
