[project]
name = "taskforge"
version = "1.0.0"
description = "Distributed job execution platform: Postgres-backed queues, worker leases, retries, DLQ, cron, webhooks, live dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "croniter>=2.0",
    "pillow>=10.3",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "psycopg2-binary>=2.9",
]

[tool.uv]
# Not a distributable library: the app runs from the working directory, so uv installs
# dependencies only and needs no build backend.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the async engine's connection pool is bound to
# the loop that created it, so per-test loops would hand asyncpg connections to a loop
# they don't belong to.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]  # autogenerated

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
