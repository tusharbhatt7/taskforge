services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &appenv
      DATABASE_URL: postgresql+asyncpg://taskforge:taskforge@postgres:5432/taskforge
      SECRET_KEY: local-dev-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker-1:
    build: .
    command: python -m app.worker
    environment: *appenv
    restart: unless-stopped  # auto-respawn after a chaos kill: the platform self-heals
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  worker-2:
    build: .
    command: python -m app.worker
    environment: *appenv
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
